[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [{name = "CJ Vines",email = "cjvines56@tamu.edu"}]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi (>=0.117.1,<0.118.0)",
    "uvicorn[standard] (>=0.36.0,<0.37.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "jsonstreams (>=0.6.0,<0.7.0)",
    "ijson (>=3.4.0,<4.0.0)",
    "colbert-ai @ git+https://github.com/stanford-futuredata/ColBERT.git",
    "faiss-cpu (>=1.12.0,<2.0.0)",
    "weaviate-client (>=4.19.2,<5.0.0)",
    "transformers (>=4.57.1,<5.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "lmdb (>=1.5.1,<2.0.0)",
    "numpy (>=2.3.0,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "ruff (>=0.13.1,<0.14.0)"
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"
